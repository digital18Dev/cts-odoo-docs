  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>

      <desc id="asig-desc">La solicitud asignacion.request se aprueba con action_aprobar_oli en asignacion.aprobacion.wizard, que pasa por asignacion.marcador.wizard si hay kits, crea el OUT de asignación con _crear_pickings_out y cambia la fase de la solicitud. Al validar el OUT, _procesar_asignacion_post_validate registra lo entregado en asignacion.empleado.asignado y cierra la solicitud en fase 4; si la OLI nació de una TIC, _propagar_cantidades_a_tic actualiza la TIC origen. Desde lo asignado se crea el picking de devolución, pasando por asignacion.kit.devolucion.wizard si son kits; su validación ejecuta _procesar_devolucion_post_validate. Aparte, una recepción manual en bodega con solicitudes_dev y sin solicitud crea al validarse un asignacion.devolucion DEV&lt;aa&gt;-NNNN con _procesar_devolucion_bodega.</desc>
