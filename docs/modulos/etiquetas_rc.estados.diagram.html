<desc id="rc-state-desc">La etiqueta nace pending. Al escanearse pasa a in_progress (mark_in_progress en Recepción, resolve_rc_scan en Alistamiento) y release_in_progress la devuelve a pending. Pasa a consumed al validar la recepción o confirmar el alistamiento. Hay dos caminos directos de pending a consumed: Recepción completa por FIFO las unidades sin escanear de productos sin rastreo, e Inventario Cíclico la materializa al generarla. Desde el 29 de septiembre de 2026, action_release_unprinted (commit 9d756afbc) pasa una etiqueta pending recién creada a cancelled cuando el ZPL no llega a la impresora; ninguna transición la saca de ahí.</desc>
